name: Build Nexa Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK with Gradle
      run: |
        cd android_native_app
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Nexa APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nexa-AI-Android-App
        path: android_native_app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
